<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10143b"><title>KUJIMO</title><link rel="icon" href="assets/kujimo-icon.png"><link rel="apple-touch-icon" href="assets/kujimo-icon.png"><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#0e1437;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 12%,#302074 0%,#111638 55%,#090f2e 100%)}main{width:min(100%,540px);margin:auto;padding:28px 20px;text-align:center}.logo{width:min(70vw,245px);filter:drop-shadow(0 10px 24px #080b28)}h1{font-size:1rem;letter-spacing:.22em;margin:10px 0 28px;color:#ecff50}.panel{border:1px solid #58538a;background:#ffffff0d;border-radius:24px;padding:23px 18px;box-shadow:0 15px 55px #080b2a55}.panel h2{font-size:1.1rem;margin:0 0 20px}.button{display:block;width:100%;border:0;border-radius:15px;background:#dbff24;color:#101536;font-size:1.06rem;font-weight:900;padding:18px;cursor:pointer;margin:12px 0}.button.secondary{background:#f5f2ff;color:#21124d}.button:active{transform:scale(.98)}.muted{color:#c8cae7;font-size:.78rem;line-height:1.6}.screen{display:none}.screen.active{display:block}.nav{background:transparent;border:1px solid #bfb2f2;border-radius:12px;padding:12px 18px;color:#fff;font-size:1rem}.mode{display:block;background:#ffffff11;color:#fff;border:1px solid #8677bf;width:100%;margin:10px 0;padding:16px;border-radius:13px;text-align:left;font-size:1rem}.field{display:block;width:100%;background:#fff;color:#111;border:0;padding:15px;border-radius:10px;font-size:1.2rem;text-align:center;letter-spacing:.14em}footer{text-align:center;padding:22px 8px env(safe-area-inset-bottom);color:#c7c9df;font-size:.75rem}#notice{font-size:.85rem;color:#eaff7a;line-height:1.6}
</style></head><body><main><img class="logo" src="assets/kujimo-icon.png" alt="KUJIMO"><h1>KUJIMO</h1><section class="screen active panel" id="home"><h2>抽選をはじめよう！</h2><button class="button" data-show="modes">新しい抽選を開始</button><button class="button secondary" data-show="watch">結果を見る（閲覧端末）</button><p class="muted">ログイン不要・無料の抽選アプリ</p></section><section class="screen panel" id="modes"><h2>抽選方法を選択</h2><button class="mode" data-pick="数字（最大4桁）">数字（最大4桁）</button><button class="mode" data-pick="A〜Z（賞）">A〜Z（賞）</button><button class="mode" data-pick="任意数字＋等">任意数字＋等</button><button class="mode" data-pick="商品名">商品名</button><p id="notice">※これは初期UIです。抽選処理はFirebase接続後に実装します。</p><button class="nav" data-show="home">戻る</button></section><section class="screen panel" id="watch"><h2>6桁の接続コード</h2><input class="field" inputmode="numeric" type="text" maxlength="6" pattern="[0-9]*" placeholder="000000"><p class="muted">Firebase連携は未設定です。コード入力による接続は次の開発工程で有効化します。</p><button class="nav" data-show="home">戻る</button></section></main><footer>© 2021–2026 Dobhar-chú</footer><script>document.querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.show).classList.add('active')}));document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('notice').textContent='「'+b.dataset.pick+'」を選択しました。次の工程で設定画面を作り込みます。'}));</script></body></html>
